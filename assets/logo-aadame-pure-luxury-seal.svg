  <text x="67" y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" letter-spacing="6.5" fill="#9A6B48">PURE ESSENTIALS</text>
