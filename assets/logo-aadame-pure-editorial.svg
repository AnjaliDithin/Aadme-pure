    <path d="M25 26 C29 23 32 19 31 16 C28 17 26 21 25 23" fill="#9A6B48" fill-opacity="0.85"/>
    <path d="M25 32 C21 29 18 25 19 22 C22 23 24 27 25 29" fill="#9A6B48" fill-opacity="0.85"/>
