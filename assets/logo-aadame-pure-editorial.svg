  <!-- High-Fashion Typography -->
  <text x="64" y="31" font-family="'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif" font-size="23" font-weight="500" letter-spacing="6" fill="#1C1917">AADAME</text>
  <text x="65" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="7" fill="#9A6B48">P U R E</text>
